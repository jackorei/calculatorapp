<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="svgs/favicon.ico" type="image/x-icon">
    <script src="script.js" defer></script>
    <script src="theme.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">  
</head>
<body>
    <div class="topbody">
        <button id="themeswitcher">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
        </button>
        <div class="title">Calculator</div>
        <div id="emptydiv1"></div>
    </div>
    <div class="midbody">
        <div class="calculator">
                <div class="calcdisplay">
                        <div class="topdisplay">
                            <div class="topinput"> </div>
                        </div>
                        <div class="maindisplay">
                            <div class="maininput"></div>
                        </div>
                </div>
                    <div class="buttons">
                        <div class="row1">
                            <button class="calcbutton" id="clear">AC</button>
                            <button class="calcbutton" id="sign">+/-</button>
                            <button class="calcbutton" id="percent">%</button>
                            <button class="calcbutton" id="add">+</button>
                        </div>
                        <div class="row2">
                            <button class="calcbutton" id="seven">7</button>
                            <button class="calcbutton" id="eight">8</button>
                            <button class="calcbutton" id="nine">9</button>
                            <button class="calcbutton" id="subtract">-</button>
                        </div>
                        <div class="row3">
                            <button class="calcbutton" id="four">4</button>
                            <button class="calcbutton" id="five">5</button>
                            <button class="calcbutton" id="six">6</button>
                            <button class="calcbutton" id="multiply">×</button>
                        </div>
                        <div class="row4">
                            <button class="calcbutton" id="one">1</button>
                            <button class="calcbutton" id="two">2</button>
                            <button class="calcbutton" id="three">3</button>
                            <button class="calcbutton" id="divide">÷</button>
                        </div>
                        <div class="row5">
                            <button class="calcbutton" id="zero">0</button>
                            <button class="calcbutton" id="decimal">.</button>
                            <button class="calcbutton" id="equals">=</button>
                        </div>
                    </div>
                </div>
    </div>
    <div class="footer">
        <div id="credits">Jack O'Reilly</div>
        <a href="https://github.com/jackorei" target="_blank"><img id="github" src="svgs/github-mark.svg" alt="github"></a>
    </div>
    </div>
</body>
</html>
